<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cesium — 3D Campus Viewer (SemTest.glb)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.115.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html,body,#cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden; font-family: Arial, Helvetica, sans-serif; }
    header { position:absolute; left:8px; top:8px; z-index: 2000; background: rgba(255,255,255,0.95); border-radius:8px; padding:8px 12px; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
    header h1 { font-size:14px; margin:0 8px 6px 0; display:inline-block; vertical-align:middle; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .controls input, .controls select, .controls button { padding:6px 8px; font-size:13px; border-radius:6px; border:1px solid #ccc; }
    aside#side { position:absolute; right:8px; top:8px; z-index:2000; width:340px; max-height:90vh; overflow:auto; background:rgba(255,255,255,0.96); border-radius:8px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,0.18); }
    #attrs { font-size:13px; color:#222; margin-top:8px; }
    .small { font-size:12px; color:#666; }
    #status { margin-top:6px; font-size:12px; color:#333; }
    #legend { margin-top:8px; }
    .legend-bar { height:12px; background:linear-gradient(90deg,#2ecc40,#ffd700,#ff4136); border-radius:6px; }
    .row { display:flex; gap:6px; margin-top:6px; }
    label { font-size:12px; color:#333; }
    #upload-row { margin-top:8px; display:flex; gap:6px; align-items:center; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <header>
    <h1>UP — Cesium 3D Campus Viewer</h1>
    <div class="controls">
      <select id="imagery-select">
        <option value="OSM">OpenStreetMap</option>
        <option value="BingAerial">Bing Aerial</option>
        <option value="CartoDark">Dark</option>
      </select>

      <input id="ion-token" placeholder="(optional) Cesium Ion Token" title="Paste Cesium Ion token here to enable terrain" style="min-width:260px"/>

      <button id="enable-terrain">Enable Terrain</button>
    </div>

    <div class="controls" style="margin-top:6px;">
      <input id="model-file" type="file" accept=".glb,.gltf" />
      <button id="load-model-btn">Load SemTest.glb</button>

      <label class="small">Lat</label>
      <input id="model-lat" type="number" step="any" placeholder="-25.75368" style="width:110px" />
      <label class="small">Lon</label>
      <input id="model-lon" type="number" step="any" placeholder="28.23014" style="width:110px" />
      <label class="small">Height (m)</label>
      <input id="model-height" type="number" step="any" placeholder="0" style="width:80px" />
      <label class="small">Scale</label>
      <input id="model-scale" type="number" step="any" value="1" style="width:70px" />
      <button id="place-model">Place Model</button>
    </div>
  </header>

  <aside id="side">
    <div>
      <label class="small">Search building name</label>
      <div class="row">
        <input id="search-name" placeholder="e.g. Aula" style="flex:1" />
        <button id="search-btn">Find</button>
      </div>
    </div>

    <div id="legend">
      <div class="small">Height Visualizer (Green → Yellow → Red)</div>
      <div class="legend-bar"></div>
      <div id="legend-range" class="small">—</div>
      <div class="row" style="margin-top:8px;">
        <button id="toggle-visualizer">Toggle Visualizer</button>
        <button id="reset-view">Reset View</button>
      </div>
    </div>

    <div id="upload-row">
      <label class="small">Load DBF attributes</label>
      <input id="dbf-input" type="file" accept=".dbf" multiple />
    </div>

    <div id="status" class="small">No model loaded.</div>
    <div id="attrs"><em>No selection</em></div>
  </aside>

  <!-- Cesium -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.115.0/Build/Cesium/Cesium.js"></script>

  <!-- shpjs for reading DBF files -->
  <script src="https://unpkg.com/shpjs@3.5.0/dist/shp.min.js"></script>

  <!-- main JS -->
  <script src="main.js"></script>
</body>
</html>
